worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # MotorLab is hosted on GitHub Pages, so NAS videos are cross-origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;

    location /videos/ {
      # NGINX supports HTTP Range requests, which browsers use for video seeking.
      add_header Accept-Ranges bytes always;
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
